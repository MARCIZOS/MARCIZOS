<svg xmlns="http://www.w3.org/2000/svg" width="288" height="60" viewBox="0 0 288 60" role="img" aria-label="LINKEDIN">
<defs>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
    <stop offset="45%" stop-color="#58A6FF" stop-opacity="0.22"/>
    <stop offset="55%" stop-color="#58A6FF" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111822"/>
    <stop offset="100%" stop-color="#0B1119"/>
  </linearGradient>
  <clipPath id="body"><rect x="0" y="0" width="288" height="60" rx="12"/></clipPath>
</defs>

<g clip-path="url(#body)">
  <rect width="288" height="60" fill="url(#face)"/>

  <!-- the travelling sheen -->
  <rect x="0" y="0" width="150" height="60" fill="url(#sheen)">
    <animate attributeName="x" values="-150;288" dur="4.6s" begin="0.575s"
      repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.2 1"/>
  </rect>

  <!-- accent rail, drawn on load -->
  <rect x="0" y="60" width="3.5" height="0" fill="#58A6FF">
    <animate attributeName="y" values="60;0" dur="0.7s" begin="0.575s" fill="freeze"
      calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animate attributeName="height" values="0;60" dur="0.7s" begin="0.575s" fill="freeze"
      calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
</g>

<rect x="0.6" y="0.6" width="286.8" height="58.8" rx="12" fill="none" stroke="#1F2A38"/>

<g transform="translate(22 19)" opacity="0.9">
  <circle cx="11" cy="7.4" r="4.1" fill="none" stroke="#58A6FF" stroke-width="1.6"/>
<path d="M2.8 20.2a8.2 8.2 0 0 1 16.4 0" fill="none" stroke="#58A6FF" stroke-width="1.6" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="translate"
    values="22 19; 22 17.4; 22 19; 22 19" dur="4.6s" begin="0.575s"
    repeatCount="indefinite" calcMode="spline" keyTimes="0;0.07;0.16;1"
    keySplines="0.3 0 0.2 1;0.3 0 0.2 1;0 0 1 1"/>
</g>

<text x="62" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700"
  fill="#E6EDF3" letter-spacing="1.4">LINKEDIN</text>
<text x="62" y="44" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#4A5B6E">in/kushagarwal0805</text>

<circle cx="268" cy="30" r="3" fill="#58A6FF" opacity="0.35">
  <animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.6s"
    begin="0.575s" repeatCount="indefinite"/>
  <animate attributeName="r" values="2.6;4;2.6" dur="4.6s"
    begin="0.575s" repeatCount="indefinite"/>
</circle>
</svg>